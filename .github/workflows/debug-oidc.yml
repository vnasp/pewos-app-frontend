name: Diagnóstico OIDC

# Solo a mano, y sin desplegar nada: es para saber qué manda GitHub y a qué rol apunta
# el secret cuando STS responde "Not authorized" sin decir por qué.
#
# `workflow_dispatch` solo aparece si el workflow ya está en la rama por defecto, así que
# mientras tanto se dispara al tocar este mismo archivo en dev.
on:
  workflow_dispatch:
  push:
    branches: [dev]
    paths: [".github/workflows/debug-oidc.yml"]

permissions:
  id-token: write
  contents: read

jobs:
  diagnostico:
    runs-on: ubuntu-latest
    steps:
      # El token en sí no se imprime nunca: solo tres claims del payload, que es lo que
      # AWS compara con la política de confianza.
      - name: Qué dice el token de GitHub
        run: |
          set -euo pipefail
          TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" | jq -r '.value')

          PAYLOAD=$(echo "$TOKEN" | cut -d. -f2 | tr '_-' '/+')
          PAD=$(( (4 - ${#PAYLOAD} % 4) % 4 ))
          PAYLOAD="${PAYLOAD}$(printf '=%.0s' $(seq 0 $PAD) | head -c $PAD)"

          echo "$PAYLOAD" | base64 -d 2>/dev/null \
            | jq '{sub, aud, repository, repository_owner, ref, iss}'

      # El valor va enmascarado en los logs, así que se imprimen hechos derivados: si
      # tiene la forma de un ARN, de qué cuenta es y cómo se llama el rol. Un salto de
      # línea pegado sin querer al final es la causa que más cuesta ver.
      - name: Qué hay en el secret AWS_ROLE_ARN
        env:
          ROLE: ${{ secrets.AWS_ROLE_ARN }}
        run: |
          if [ -z "${ROLE:-}" ]; then
            echo "✗ el secret AWS_ROLE_ARN está vacío o no existe en este repositorio"
            exit 1
          fi

          echo "largo ............ ${#ROLE}"
          LIMPIO=$(printf '%s' "$ROLE" | tr -d '\r\n')
          if [ "${#LIMPIO}" -ne "${#ROLE}" ]; then
            echo "✗ tiene un salto de línea al final — STS lo rechaza por ARN inválido"
          else
            echo "✓ sin espacios ni saltos de línea sobrantes"
          fi

          if printf '%s' "$LIMPIO" | grep -qE '^arn:aws:iam::[0-9]{12}:role/.+$'; then
            echo "✓ tiene forma de ARN de rol"
            echo "cuenta ........... $(printf '%s' "$LIMPIO" | cut -d: -f5)"
            echo "rol .............. $(printf '%s' "$LIMPIO" | cut -d/ -f2-)"
          else
            echo "✗ NO tiene forma de ARN de rol (arn:aws:iam::<12 dígitos>:role/<nombre>)"
          fi

      - name: Intentar asumirlo
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Quién soy en AWS
        run: aws sts get-caller-identity
