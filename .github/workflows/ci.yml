name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

# Un push encima de otro en la misma rama cancela el anterior: la revisión que importa
# es la del último commit, y el tier gratuito de Actions tiene minutos contados.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      # `ci` y no `install`: instala exactamente lo del lock y falla si se desincronizó
      # del package.json, que es justo lo que no queremos descubrir en producción.
      - run: npm ci

      - name: Tipos
        run: npx tsc -b --noEmit

      - name: Lint
        run: npx eslint .

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build
